<!-- CM001 - HTML Setup and Head with Favicon -->
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanjeeva Admin Portal</title>
<link rel="icon" type="image/png" sizes="32x32" href="https://sanjeeva-hspl.github.io/SM-IMG/02-SMH-HOSPITAL%20LOGO.png">
<link rel="apple-touch-icon" href="https://sanjeeva-hspl.github.io/SM-IMG/02-SMH-HOSPITAL%20LOGO.png">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { theme: { extend: {} } }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;600;900&display=swap" rel="stylesheet">
<style>

/* CM002 - CSS Reset Global Styles and Scrollbar Hide */
* { scrollbar-width: none; -ms-overflow-style: none; scroll-behavior: smooth; box-sizing: border-box; }
::-webkit-scrollbar { display: none; }
body { margin: 0; padding: 0; font-family: 'Roboto Slab', serif; background: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow-x: hidden; font-size: 10px; color: #0f172a; -webkit-font-smoothing: antialiased; font-weight: 600; }

/* CM003 - CSS App Main Container */
#appContainer { width: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; }

/* CM004 - CSS Compact Login Card Center Aligned No Border */
.wrapper { overflow: hidden; width: 220px; background: #ffffff; padding: 14px 12px; border-radius: 12px; margin: auto; display: flex; flex-direction: column; align-items: center; box-shadow: 0px 10px 25px rgba(0,0,0,0.1); }
.admin-badge-wrap { display: flex; justify-content: center; width: 100%; margin-top: 4px; margin-bottom: 12px; }
.admin-badge-text { background: #0f172a; color: #fff; padding: 4px 16px; border-radius: 20px; font-size: 9px; font-weight: 900; letter-spacing: 1px; box-shadow: inset 0px -2px 4px rgba(0,0,0,0.3); text-transform: uppercase; }

/* CM005 - CSS Login Logo & HD Name */
.hospital-logo-container { display: flex; justify-content: center; margin-bottom: 8px; width: 100%; }
.hospital-logo-container img { width: 50px; height: 50px; border-radius: 50%; padding: 2px; object-fit: contain; background: #fff; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.1)); }
.hospital-name { font-size: 11px; font-weight: 900; text-align: center; margin-bottom: 4px; color: #0f172a; text-transform: uppercase; letter-spacing: 0.5px; line-height: 1.3; text-shadow: 0px 1px 1px rgba(255,255,255,1); }

/* CM006 - CSS Login Form Fields 3D Reduced Size */
.form-inner { width: 100%; }
.form-inner form .field { height: 32px; width: 100%; margin-top: 10px; position: relative; display: flex; align-items: center; gap: 6px; }
.input-icon { font-size: 13px; filter: drop-shadow(0px 1px 1px rgba(0,0,0,0.1)); }
.form-inner form .field input { height: 100%; width: 100%; outline: none; padding-left: 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-family: 'Roboto Slab', serif; font-size: 9px; transition: all 0.3s ease; background: #f1f5f9; color: #0f172a; font-weight: 600; box-shadow: inset 1px 1px 3px rgba(0,0,0,0.05); }
.form-inner form .field input:focus { border-color: #3b82f6; background: #fff; box-shadow: 0px 0px 0px 2px rgba(59,130,246,0.2); }

/* CM007 - CSS Login Button & Forgot */
.form-inner form .btn { height: 34px; border-radius: 8px; overflow: hidden; margin-top: 14px; background: linear-gradient(145deg, #3b82f6, #2563eb); box-shadow: 2px 2px 5px rgba(0,0,0,0.15); display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; transition: 0.2s; border: none; padding: 0; }
.form-inner form .btn:active { transform: translateY(2px); box-shadow: inset 2px 2px 5px rgba(0,0,0,0.2); }
.form-inner form .btn input[type="submit"] { background: none; border: none; color: #fff; font-size: 11px; font-weight: 900; font-family: 'Roboto Slab', serif; cursor: pointer; text-transform: uppercase; text-shadow: 0px 1px 2px rgba(0,0,0,0.4); outline: none; padding: 0; width: 100%; height: 100%; }
.forgot-pass { text-align: center; margin-top: 12px; font-size: 9px; display: flex; justify-content: center; align-items: center; gap: 4px; }
.forgot-pass a { color: #475569; text-decoration: none; font-weight: 600; transition: 0.2s; text-transform: uppercase; }

/* CM008 - CSS Admin Dashboard View */
.dashboard-view { display: none; width: 100%; min-height: 100vh; flex-direction: column; background: #f8fafc; align-items: flex-start; justify-content: flex-start; }

/* CM009 - CSS Header Increased Size & HD Scrollable */
.dash-header { background: #ffffff; padding: 10px 14px; box-shadow: 0px 2px 10px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; width: 100%; height: auto; min-height: 54px; }
.dash-title-wrap { display: flex; align-items: center; gap: 10px; }
.dash-logo-small { width: 34px; height: 34px; border-radius: 50%; object-fit: contain; background: #fff; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.1)); }
.dash-title-text { font-size: 14px; font-weight: 900; color: #0f172a; line-height: 1.2; display: flex; flex-direction: column; text-transform: uppercase; text-shadow: 0px 1px 1px rgba(255,255,255,1); }
.dash-title-sub { font-size: 9px; color: #475569; font-weight: 600; letter-spacing: 0.5px; }

/* CM010 - CSS Header Actions & Blinking Dot */
.header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
@keyframes pulseBlink { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } 100% { opacity: 1; transform: scale(1); } }
.blink-dot { display: inline-block; width: 6px; height: 6px; background-color: #a7f3d0; border-radius: 50%; margin-right: 4px; animation: pulseBlink 1s infinite; vertical-align: middle; box-shadow: 0 0 4px #a7f3d0; }
.live-staff-badge { font-size: 9px; font-weight: 900; color: #fff; background: linear-gradient(145deg, #10b981, #059669); padding: 4px 10px; border-radius: 20px; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); text-transform: uppercase; border: 1px solid #047857; letter-spacing: 0.5px; display: flex; align-items: center; }
.admin-month-select { border: 1px solid #cbd5e1; border-radius: 6px; padding: 2px 8px; font-size: 10px; font-family: 'Roboto Slab', serif; font-weight: 900; color: #0f172a; outline: none; background: #f8fafc; cursor: pointer; height: 30px; box-shadow: inset 1px 1px 2px rgba(0,0,0,0.05); text-transform: uppercase; }
.hd-icon-btn { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 6px; width: 30px; height: 30px; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; transition: 0.2s; box-shadow: 2px 2px 5px rgba(0,0,0,0.05); outline: none; filter: drop-shadow(0px 1px 1px rgba(0,0,0,0.1)); }
.hd-icon-btn:active { box-shadow: inset 2px 2px 4px rgba(0,0,0,0.1); transform: translateY(1px); }
.hd-icon-btn.req { position: relative; }
.hd-icon-btn.req .badge { position: absolute; top: -5px; right: -5px; background: #ef4444; color: #fff; font-size: 8px; font-weight: 900; border-radius: 50%; width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; border: 1px solid #fff; box-shadow: 0px 2px 4px rgba(0,0,0,0.3); }

/* CM011 - CSS Table Wrapper & Full Width No Gaps */
.dash-content { padding: 0; width: 100%; display: flex; flex-direction: column; flex-grow: 1; overflow: hidden; align-items: flex-start; justify-content: flex-start; }
.table-wrapper { background: #fff; width: 100%; overflow-x: auto; flex-grow: 1; }
.att-table { width: 100%; border-collapse: collapse; min-width: max-content; }
.att-table th, .att-table td { padding: 2px 4px; border: 1px solid #e2e8f0; text-align: center; vertical-align: middle; white-space: nowrap; font-size: 10px; }
.att-table th { background: #f1f5f9; color: #0f172a; font-weight: 900; font-size: 9px; text-transform: uppercase; border-bottom: 1px solid #cbd5e1; height: 28px; }

/* CM012 - CSS Sticky Columns ID Only Left Scroll Name */
.att-table th.sticky-col, .att-table td.sticky-col { position: sticky; z-index: 5; background: #ffffff; border-right: 1px solid #cbd5e1; }
.att-table th.sticky-col { background: #f1f5f9; }
.att-table tr:nth-child(even) td.sticky-col { background: #f8fafc; }
.sticky-col.sno { left: 0; min-width: 30px; font-weight: 900; color: #475569; }
.sticky-col.id { left: 30px; min-width: 60px; font-weight: 900; color: #3b82f6; }

/* CM013 - CSS Name, Role & Shift Column Decreased Size */
.td-name { min-width: 200px; text-align: left; padding: 4px 6px !important; }
.name-wrap { display: flex; flex-direction: column; gap: 2px; }
.n-row { display: flex; align-items: center; gap: 4px; font-size: 9px; font-weight: 900; color: #0f172a; text-transform: uppercase; }
.r-row { font-size: 8px; color: #64748b; font-weight: 600; text-transform: uppercase; padding-left: 16px; }
.s-row { display: flex; align-items: center; gap: 4px; font-size: 8px; color: #0f172a; font-weight: 600; background: #f1f5f9; padding: 2px 4px; border-radius: 4px; border: 1px solid #e2e8f0; margin-left: 16px; }
.shift-icon-btn { cursor: pointer; color: #3b82f6; font-size: 10px; border: none; background: none; padding: 0; outline: none; font-weight: 900; }
.st-row { display: flex; gap: 4px; margin-left: 16px; margin-top: 2px; }
.sb { padding: 1px 4px; border-radius: 3px; border: 1px solid; font-size: 7px; font-weight: 900; text-transform: uppercase; }
.sb-w { background: #e0f2fe; color: #0284c7; border-color: #bae6fd; }
.sb-p { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
.sb-a { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
.sb-l { background: #fef9c3; color: #854d0e; border-color: #fef08a; }

/* CM014 - CSS 6-Punch Thin Grid Inside Cell */
.punch-grid { display: flex; flex-direction: column; width: 110px; margin: 0 auto; background: #fff; cursor: pointer; transition: 0.2s; border: 1px solid transparent; border-radius: 4px; }
.punch-grid:hover { border-color: #3b82f6; box-shadow: 0px 2px 5px rgba(0,0,0,0.05); }
.p-r { display: grid; grid-template-columns: 1fr 1fr; font-size: 8px; font-weight: 600; color: #334155; padding: 1px; text-align: center; border-bottom: 1px solid #f1f5f9; }
.p-r span { display: inline-flex; justify-content: center; align-items: center; }
.p-r span:first-child { border-right: 1px solid #f1f5f9; }
.p-f { display: flex; justify-content: space-between; align-items: center; font-size: 9px; font-weight: 900; padding: 2px 4px; background: linear-gradient(145deg, #f1f5f9, #e2e8f0); border-radius: 0 0 4px 4px; color: #0f172a; }
.hrs-bold { font-weight: 900; color: #000; }
.late-txt { color: #ef4444; display: inline-flex; align-items: center; gap: 2px; }
.st-b { padding: 1px 4px; border-radius: 2px; color: #fff; font-size: 7px; text-transform: uppercase; display: inline-block; min-width: 12px; text-align: center; }

/* CM015 - CSS Today Highlight & Zebra Rows */
.today-col { background-color: #e0f2fe !important; border-left: 1px solid #3b82f6 !important; border-right: 1px solid #3b82f6 !important; }
.att-table th.today-col { background-color: #bae6fd !important; color: #0284c7; border-bottom: 1px solid #3b82f6; }
.att-table tr:nth-child(even) td:not(.sticky-col) { background: #f8fafc; }
.att-table tr:nth-child(odd) td:not(.sticky-col) { background: #ffffff; }
.att-table tr:nth-child(even) td.today-col { background: #dbeafe !important; }

/* CM016 - CSS Footer Row Totals Scrollable */
.footer-row td { background: #0f172a !important; color: #fff; font-weight: 900; text-transform: uppercase; padding: 8px 10px; border: 1px solid #334155; font-size: 10px; letter-spacing: 0.5px; text-align: left !important; }
.footer-stats { display: flex; justify-content: flex-start; gap: 15px; align-items: center; flex-wrap: wrap; }
.fs-item { background: #1e293b; padding: 4px 10px; border-radius: 6px; border: 1px solid #475569; display: inline-flex; align-items: center; gap: 4px; }
.fs-lbl { color: #94a3b8; font-weight: 600; }

/* CM017 - CSS Modals Generic Overlay */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(2px); }
.modal-box { background: #ffffff; width: 95%; max-width: 320px; padding: 16px; border-radius: 12px; box-shadow: 0px 15px 30px rgba(0,0,0,0.3); position: relative; max-height: 85vh; overflow-y: auto; border: 1px solid #e2e8f0; }
.modal-close { position: absolute; top: 8px; right: 10px; font-size: 18px; cursor: pointer; color: #94a3b8; border: none; background: none; font-weight: 900; outline: none; }
.modal-title { font-size: 12px; font-weight: 900; color: #0f172a; margin-bottom: 12px; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; text-transform: uppercase; }

/* CM018 - CSS Time Edit Modal Details */
.time-list { display: flex; flex-direction: column; gap: 6px; }
.time-row { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 6px 8px; border-radius: 6px; border: 1px solid #e2e8f0; font-size: 10px; font-weight: 600; color: #334155; }
.time-lbl { width: 40px; font-weight: 900; color: #0f172a; }
.time-val { font-size: 11px; flex-grow: 1; text-align: center; }
.time-edit-btn { background: none; border: none; font-size: 12px; cursor: pointer; color: #3b82f6; outline: none; }
.edit-mode-wrap { display: flex; gap: 4px; align-items: center; justify-content: flex-end; flex-grow: 1; }
.t-sel { padding: 2px; border: 1px solid #cbd5e1; border-radius: 4px; font-family: 'Roboto Slab', serif; font-size: 9px; outline: none; }
.save-t-btn { background: #10b981; color: #fff; border: none; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 900; cursor: pointer; }

/* CM019 - CSS Shift Change Modal */
.shift-rad-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; background: #f1f5f9; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; cursor: pointer; }
.shift-rad-wrap input { cursor: pointer; }
.shift-rad-wrap label { font-size: 10px; font-weight: 900; color: #0f172a; cursor: pointer; flex-grow: 1; text-transform: uppercase; }
.shift-confirm-btn { width: 100%; background: #3b82f6; color: #fff; border: none; padding: 10px; border-radius: 6px; font-size: 11px; font-weight: 900; cursor: pointer; margin-top: 10px; text-transform: uppercase; box-shadow: 0px 4px 6px rgba(59,130,246,0.3); }

/* CM020 - CSS Utility Toasts */
.toast-msg { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 10px; font-weight: 900; text-transform: uppercase; box-shadow: 0px 6px 15px rgba(0,0,0,0.3); display: none; z-index: 2000; border: 1px solid #334155; }

/* CM021 - CSS Print Optimization */
@media print { @page { size: A3 landscape; margin: 5mm; } body { background: #fff; } * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; } .dash-header, .header-actions, .footer-row { display: none !important; } .table-wrapper { height: auto; overflow: visible; box-shadow: none; } .att-table { zoom: 0.65; } .att-table th, .att-table td { border: 1px solid #000; } }
</style>
</head>
<body>

<!-- CM022 - HTML App Container Start -->
<div id="appContainer">

<!-- CM023 - HTML Login View Compact -->
<div id="loginView" class="wrapper">
<div class="hospital-logo-container"><img id="hospLogo" src="" alt="Logo"></div>
<div class="hospital-name">SANJEEVA MULTISPECIALTY HOSPITAL, ALLAGADDA</div>
<div class="admin-badge-wrap"><span class="admin-badge-text">ADMIN SECURE LOGIN</span></div>
<div class="form-inner">
<form action="#" id="adminForm" class="login">
<div class="field"><span class="input-icon">👤</span><input type="text" id="adminUser" placeholder="ADMIN USERNAME" required></div>
<div class="field"><span class="input-icon">🔒</span><input type="password" id="adminPass" placeholder="4-DIGIT PIN" maxlength="4" pattern="\d{4}" required></div>
<button type="submit" class="field btn"><span class="input-icon" style="color:#fff;">➔</span><input type="submit" value="LOGIN" disabled style="display:none;"><span style="color:#fff;font-size:11px;font-weight:900;">LOGIN</span></button>
<div class="forgot-pass"><a href="#">❓ Forgot Password?</a></div>
</form>
</div></div>

<!-- CM024 - HTML Admin Dashboard View -->
<div id="adminDashboardView" class="dashboard-view">

<!-- CM025 - HTML Header Not Sticky -->
<div class="dash-header">
<div class="dash-title-wrap"><img id="dashLogo" src="" alt="Logo" class="dash-logo-small"><div class="dash-title-text"><span>SANJEEVA MULTISPECIALTY HOSPITAL, ALLAGADDA</span><span class="dash-title-sub">ADMINISTRATOR PORTAL</span></div></div>
<div class="header-actions">
<span class="live-staff-badge" id="liveStaffCount"><span class="blink-dot"></span>LIVE STAFF: 0</span>
<select class="admin-month-select" id="aMonth"></select>
<button class="hd-icon-btn" onclick="window.print()" title="Download Full Data">📥</button>
<button class="hd-icon-btn req" id="adminReqBtn" title="Requests">🔔<span class="badge" id="aReqCount">3</span></button>
<button class="hd-icon-btn" onclick="reloadData()" title="Refresh">↻</button>
<button class="hd-icon-btn" id="logoutAdminBtn" title="Logout" style="color:#ef4444;">⏻</button>
</div></div>

<!-- CM026 - HTML Content & Horizontal Scroll Table -->
<div class="dash-content"><div class="table-wrapper">
<table class="att-table">
<thead id="aTableHead"></thead>
<tbody id="aTableBody"></tbody>
<tfoot id="aTableFoot"></tfoot>
</table>
</div></div>
</div>

<!-- CM027 - HTML Modals (Attendance Detail, Shift Change, Requests) -->
<div class="modal-overlay" id="attModal"><div class="modal-box">
<button class="modal-close" onclick="clsMod('attModal')">&times;</button>
<div class="modal-title" id="attModTitle">ATTENDANCE DETAILS</div>
<div class="time-list" id="attModCont"></div>
</div></div>

<div class="modal-overlay" id="shiftModal"><div class="modal-box">
<button class="modal-close" onclick="clsMod('shiftModal')">&times;</button>
<div class="modal-title" id="shiftModTitle">CHANGE SHIFT (FROM TODAY)</div>
<div class="shift-rad-wrap"><input type="radio" name="shiftSel" id="s4" value="4"><label for="s4">▶ 4-SHIFTS (Morning & Evening Splits)</label></div>
<div class="shift-rad-wrap"><input type="radio" name="shiftSel" id="s2" value="2"><label for="s2">▶ 2-SHIFTS (Full Day)</label></div>
<div class="shift-rad-wrap"><input type="radio" name="shiftSel" id="s1" value="1"><label for="s1">▶ NIGHT SHIFT (Overnight)</label></div>
<button class="shift-confirm-btn" onclick="saveShift()">CONFIRM SHIFT</button>
</div></div>

<div class="modal-overlay" id="reqModal"><div class="modal-box">
<button class="modal-close" onclick="clsMod('reqModal')">&times;</button>
<div class="modal-title">PENDING REQUESTS</div>
<div id="reqAdminCont"></div>
</div></div>

<!-- CM028 - HTML Utility Toasts -->
<div class="toast-msg" id="toastMsg">DATA REFRESHED ✅</div>

</div>
<script>

/* CM029 - JS Configuration and Links */
const AppLinks = { logo: "https://sanjeeva-hspl.github.io/SM-IMG/02-SMH-HOSPITAL%20LOGO.png" };
document.getElementById('hospLogo').src = AppLinks.logo; document.getElementById('dashLogo').src = AppLinks.logo;
const AppConf = { mos: ["January","February","March","April","May","June","July","August","September","October","November","December"] };
const today = new Date(); const cY = today.getFullYear(); const cM = today.getMonth(); const cD = today.getDate();
const fDate = (d,m,y) => `${String(d).padStart(2,'0')} ${AppConf.mos[m].substring(0,3)} ${y}`;
const enfU = (e) => e.target.value = e.target.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
document.getElementById("adminUser").addEventListener('input', enfU);

/* CM030 - JS Utilities & Modal Close Actions */
const clsMod = (id) => document.getElementById(id).style.display = "none";
const opnMod = (id) => document.getElementById(id).style.display = "flex";
window.onclick = (e) => { if(e.target.classList.contains('modal-overlay')) e.target.style.display = 'none'; };
const reloadData = () => { genAdminData(); const t = document.getElementById('toastMsg'); t.style.display='block'; setTimeout(()=>t.style.display='none', 2000); };

/* CM031 - JS Month Dropdown Generation */
const popMos = (elId) => { const s = document.getElementById(elId); let h = "";
for(let m=cM; m<=11; m++) h+=`<option value="${m}-${cY}">${AppConf.mos[m].substring(0,3)} ${cY}</option>`;
for(let m=0; m<=5; m++) h+=`<option value="${m}-${cY+1}">${AppConf.mos[m].substring(0,3)} ${cY+1}</option>`;
s.innerHTML = h; s.value = `${cM}-${cY}`; s.onchange = () => { genAdminData(); }; };

/* CM032 - JS Dummy Staff Data Generator With Daily Shift Tracking */
const genDummyStaff = (count) => { let arr=[]; for(let i=1;i<=count;i++){ 
let sT=4, r="Sister", ts="09:00 AM - 01:00 PM, 02:00 PM - 06:00 PM", sN="4-Shifts", pC=Math.floor(Math.random()*6)+20, lC=Math.floor(Math.random()*4);
if(i>8 && i<=16){sT=2; r="Compounder"; ts="09:00 AM - 05:00 PM"; sN="2-Shifts";} else if(i>16){sT=1; r="Sister"; ts="08:00 PM - 08:00 AM"; sN="Night";}
let sTrack = []; for(let d=1; d<=31; d++) sTrack[d] = sT; 
arr.push({ id:`SMH-10${String(i+20).padStart(2,'0')}`, name:`STAFF ${i}`, role:r, curType:sT, tStr:ts, sName:sN, w:30, p:pC, a:30-pC, l:lC, shiftTrack: sTrack }); } return arr; };
let dummyStaff = genDummyStaff(25); let curStfIdx = null;

/* CM033 - JS 12-Hour Format Cell Generator Logic Based On Daily Shift */
const getCellData = (d, sM, sY, isCurrentMonth, dailyShiftType) => { 
let o={ mi:"-", mo:"-", ei:"-", eo:"-", ni:"-", no:"-", hrs:"-", st:"P", sc:"#166534", bg:"#dcfce7", isLate:false };
const isFuture = (sY>cY || (sY===cY && sM>cM) || (isCurrentMonth && d>cD));
if(isFuture) { o.st="W"; o.sc="#64748b"; o.bg="#f1f5f9"; return o; }
const r=Math.random(); if(r>0.9){o.st="A"; o.sc="#991b1b"; o.bg="#fee2e2"; o.hrs="0h"; return o;}
o.hrs="8h"; o.isLate = (r>0.7 && r<=0.9); if(o.isLate){ o.st="L"; o.sc="#854d0e"; o.bg="#fef9c3"; o.hrs="7h"; }
if(dailyShiftType===4){ o.mi=o.isLate?"09:18 AM":"09:00 AM"; o.mo="01:00 PM"; o.ei="02:00 PM"; o.eo="06:00 PM"; }
else if(dailyShiftType===2){ o.mi=o.isLate?"09:20 AM":"09:00 AM"; o.eo="05:00 PM"; }
else if(dailyShiftType===1){ o.ni=o.isLate?"08:15 PM":"08:00 PM"; o.no="08:00 AM"; o.hrs="12h"; }
return o; };

/* CM034 - JS Generate Grid HTML for Cell */
const buildGrid = (c) => { 
let miH = c.isLate && c.mi!=="-" ? `<span class="late-txt">${c.mi} ⏳</span>` : c.mi;
let niH = c.isLate && c.ni!=="-" ? `<span class="late-txt">${c.ni} ⏳</span>` : c.ni;
return `<div class="punch-grid"><div class="p-r"><span>MI:${miH}</span><span>MO:${c.mo}</span></div><div class="p-r"><span>EI:${c.ei}</span><span>EO:${c.eo}</span></div><div class="p-r"><span>NI:${niH}</span><span>NO:${c.no}</span></div><div class="p-f" style="background:${c.bg}; color:${c.sc}"><span>Hrs: <span class="hrs-bold">${c.hrs}</span></span><span class="st-b" style="background:${c.sc}">${c.st}</span></div></div>`; };

/* CM035 - JS Generate Table & Sticky Alignments & Footer Totals */
const genAdminData = () => { const vp = document.getElementById("aMonth").value.split('-'); const sM = parseInt(vp[0]), sY = parseInt(vp[1]);
const isCurMonth = (sM === cM && sY === cY); const mD = new Date(sY, sM+1, 0).getDate();
const thd = document.getElementById("aTableHead"); let thHTML = `<tr><th class="sticky-col sno">S.No</th><th class="sticky-col id">ID</th><th class="td-name">NAME, SHIFT & STATS</th>`;
for(let d=1; d<=mD; d++) { const isToday = (isCurMonth && d===cD); thHTML += `<th class="${isToday ? 'today-col' : ''}" ${isToday ? 'id="td-today-th"' : ''}>${d} ${AppConf.mos[sM].substring(0,3)}</th>`; } thd.innerHTML = thHTML + `</tr>`;
const tb = document.getElementById("aTableBody"); tb.innerHTML = '';
let totAtt=0, totLate=0, liveStf=0;
dummyStaff.forEach((stf, idx) => { 
let stats = `<div class="st-row"><span class="sb sb-w">W:${stf.w}</span><span class="sb sb-a">A:${stf.a}</span><span class="sb sb-l">L:${stf.l}</span></div>`;
let sh = `<div class="s-row"><span>${stf.sName}: ${stf.tStr}</span><button class="shift-icon-btn" onclick="trigShift(${idx})" title="Change Shift">⇄</button></div>`;
let nc = `<td class="td-name"><div class="name-wrap"><div class="n-row">👤 ${stf.name}</div><div class="r-row">${stf.role}</div>${sh}${stats}</div></td>`;
let tr = `<tr><td class="sticky-col sno">${idx+1}</td><td class="sticky-col id">${stf.id}</td>${nc}`;
for(let d=1; d<=mD; d++) { const isToday = (isCurMonth && d===cD); const cd = getCellData(d, sM, sY, isCurMonth, stf.shiftTrack[d]);
if(isToday && (cd.st==="P" || cd.st==="L")) { totAtt++; if(cd.st==="L") totLate++; if(Math.random()>0.2) liveStf++; }
tr += `<td class="${isToday ? 'today-col' : ''}" onclick="opnAttMod(${idx}, ${d}, '${JSON.stringify(cd)}')">${buildGrid(cd)}</td>`; } tb.innerHTML += tr + `</tr>`; }); 
document.getElementById("liveStaffCount").innerHTML = `<span class="blink-dot"></span>LIVE STAFF: ${liveStf}`;
document.getElementById("aTableFoot").innerHTML = `<tr class="footer-row"><td colspan="${3+mD}"><div class="footer-stats"><span class="fs-lbl">TODAY TOTALS:</span><span class="fs-item">ATTENDED: ${totAtt}</span><span class="fs-item" style="color:#ef4444;">LATE: ${totLate}</span><span class="fs-item" style="color:#10b981;">LIVE IN HOSPITAL: ${liveStf}</span></div></td></tr>`;
setTimeout(()=>{ const el=document.getElementById('td-today-th'); if(el){ el.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'}); } }, 300); };

/* CM036 - JS Popups for Full Cell Editing */
let curCd = {}; let curD = 0;
const opnAttMod = (idx, d, cdStr) => { curStfIdx=idx; curD=d; curCd = JSON.parse(cdStr); const s = dummyStaff[idx];
document.getElementById("attModTitle").innerText = `ATTENDANCE - ${s.name} (${fDate(d, cM, cY)})`;
renderAttTimes(); opnMod("attModal"); };
const renderAttTimes = () => { const c = document.getElementById("attModCont"); c.innerHTML="";
const p = [ {k:'mi', l:'MRG IN'}, {k:'mo', l:'MRG OUT'}, {k:'ei', l:'EVN IN'}, {k:'eo', l:'EVN OUT'}, {k:'ni', l:'NGT IN'}, {k:'no', l:'NGT OUT'} ];
p.forEach(x => { c.innerHTML += `<div class="time-row" id="tr-${x.k}"><span class="time-lbl">${x.l}</span><span class="time-val">${curCd[x.k]}</span><button class="time-edit-btn" onclick="edtT('${x.k}')">✎</button></div>`; }); };
const edtT = (k) => { const el = document.getElementById(`tr-${k}`); let h="", m="", a="";
for(let i=1;i<=12;i++) h+=`<option value="${String(i).padStart(2,'0')}">${String(i).padStart(2,'0')}</option>`;
for(let i=0;i<60;i++) m+=`<option value="${String(i).padStart(2,'0')}">${String(i).padStart(2,'0')}</option>`;
a = `<option value="AM">AM</option><option value="PM">PM</option>`;
el.innerHTML = `<span class="time-lbl">${k.toUpperCase()}</span><div class="edit-mode-wrap"><select class="t-sel" id="h-${k}">${h}</select>:<select class="t-sel" id="m-${k}">${m}</select><select class="t-sel" id="a-${k}">${a}</select> <button class="save-t-btn" onclick="savT('${k}')">SAVE</button></div>`; };
const savT = (k) => { curCd[k] = `${document.getElementById(`h-${k}`).value}:${document.getElementById(`m-${k}`).value} ${document.getElementById(`a-${k}`).value}`; renderAttTimes(); reloadData(); };

/* CM037 - JS Historical Shift Change Logic From Today Only */
const trigShift = (idx) => { curStfIdx=idx; document.getElementById("shiftModTitle").innerText = `CHANGE SHIFT - ${dummyStaff[idx].name} (APPLIES FROM TODAY)`; document.getElementById(`s${dummyStaff[idx].curType}`).checked = true; opnMod("shiftModal"); };
const saveShift = () => { const v = parseInt(document.querySelector('input[name="shiftSel"]:checked').value); let n="", t="";
if(v===4){n="4-Shifts"; t="09:00 AM-01:00 PM, 02:00 PM-06:00 PM";} else if(v===2){n="2-Shifts"; t="09:00 AM-05:00 PM";} else if(v===1){n="Night"; t="08:00 PM-08:00 AM";}
dummyStaff[curStfIdx].sName = n; dummyStaff[curStfIdx].tStr = t; dummyStaff[curStfIdx].curType = v;
for(let d=cD; d<=31; d++) dummyStaff[curStfIdx].shiftTrack[d] = v;
clsMod("shiftModal"); reloadData(); };

/* CM038 - JS Admin Detailed Requests Logic */
const popReqs = () => { const c = document.getElementById("reqAdminCont"); c.innerHTML=""; 
const dr = [ {id:"SMH-1024", n:"STAFF 4", type:"Leave Request", desc:"Family function."}, {id:"SMH-1027", n:"STAFF 7", type:"Time Mod", desc:"Forgot punch in."} ];
dr.forEach((r, i) => { c.innerHTML += `<div style="padding:8px; border:1px solid #e2e8f0; border-radius:6px; margin-bottom:8px; background:#f8fafc; font-size:10px;"><div style="font-weight:900; color:#0f172a; margin-bottom:4px;">${r.id} - ${r.n}</div><div style="color:#3b82f6; font-weight:900; margin-bottom:4px;">${r.type}</div><div style="color:#475569; margin-bottom:6px;">${r.desc}</div><div style="display:flex; justify-content:flex-end; gap:6px;"><button onclick="this.parentElement.parentElement.innerHTML='<div style=\\'text-align:center;color:#10b981;font-weight:900;\\'>✅ APPROVED</div>'" style="background:#10b981; color:#fff; border:none; padding:4px 10px; border-radius:4px; font-weight:900; cursor:pointer;">✅</button><button onclick="this.parentElement.parentElement.innerHTML='<div style=\\'text-align:center;color:#ef4444;font-weight:900;\\'>❌ REJECTED</div>'" style="background:#ef4444; color:#fff; border:none; padding:4px 10px; border-radius:4px; font-weight:900; cursor:pointer;">❌</button></div></div>`; }); };
document.getElementById("adminReqBtn").onclick = () => { popReqs(); opnMod("reqModal"); };

/* CM039 - JS Login Form Flow */
document.getElementById("adminForm").onsubmit = (e) => { e.preventDefault(); document.getElementById("loginView").style.display="none"; document.getElementById("adminDashboardView").style.display="flex"; document.body.style.alignItems="flex-start"; popMos("aMonth"); genAdminData(); };
document.getElementById("logoutAdminBtn").onclick = () => { document.getElementById("adminDashboardView").style.display="none"; document.getElementById("loginView").style.display="flex"; document.body.style.alignItems="center"; document.getElementById("adminForm").reset(); };

</script>
